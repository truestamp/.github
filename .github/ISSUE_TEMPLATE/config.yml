# Default issue chooser for every Truestamp repository that doesn't have its
# own .github/ISSUE_TEMPLATE folder.

blank_issues_enabled: true
contact_links:
  - name: Question or discussion
    url: https://github.com/orgs/truestamp/discussions
    about: Ask questions and talk with the Truestamp team and community.

  - name: Feature idea or product feedback
    url: https://truestamp.userjot.com/board/features
    about: Suggest and vote on ideas, and see what's already been asked for. To post without a UserJot account, use the Feedback popup at truestamp.com/support.

  - name: Security vulnerability
    url: https://github.com/truestamp/.github/blob/main/SECURITY.md
    about: Please report security issues privately, not as a public issue.

  - name: Help using Truestamp
    url: https://www.truestamp.com/support
    about: Knowledge base, API docs, FAQ, and support@truestamp.com.
